<supbar></supbar><div class="menu"><sidebar modulo="administracion"></sidebar><main class="pagina">
<h1 class="titulo">{{gestion?'GESTIÓN':'REGISTRO'}} DE RELACIONES DE EMPRESA</h1>
<div barraAcciones class="toolbar"><button class="boton boton-accion accion-consultar" (click)="consultar()">Consultar</button><button *ngIf="!gestion" class="boton boton-accion accion-insertar" (click)="insertar()">Insertar</button><button *ngIf="seleccion" class="boton boton-accion accion-ver" (click)="ver()">Ver</button><button *ngIf="!gestion&&seleccion" class="boton boton-accion accion-modificar" (click)="ver('modificar')">Modificar</button><button *ngIf="!gestion&&seleccion" class="boton boton-accion accion-eliminar" (click)="eliminar()">Eliminar</button><button *ngIf="gestion&&seleccion?.activa" class="boton boton-accion accion-baja" (click)="baja()">Baja</button><button *ngIf="gestion&&seleccion&&!seleccion.activa" class="boton boton-accion accion-reactivar" (click)="reactivar()">Reactivar</button><button *ngIf="gestion&&seleccion" class="boton boton-accion accion-historico" (click)="verHistorico()">Histórico</button><button class="boton boton-accion accion-volver" (click)="volver()">Volver</button></div>
<section *ngIf="vista==='tabla'" class="tabla-contenedor">
  <tabla titulo="TABLA DE RELACIONES DE EMPRESA"
    [claveConfiguracion]="gestion?'administracion.relacionesEmpresa.gestion':'administracion.relacionesEmpresa.registro'"
    [columnas]="columnas" [titulosColumnas]="titulosColumnas"
    [columnasOcultasPorDefecto]="columnasOcultas" [incluirBajas]="true"
    [datos]="filas" (filtroSolicitado)="consultar()"
    (filaSeleccionada)="seleccionarFila($event)"></tabla>
</section>
<section *ngIf="vista==='formulario'" class="form-contenedor"><datosIdentificacion [campos]="identificacion"></datosIdentificacion><div class="form-grupo"><label class="titulo">Datos Relación</label><div class="form-fila"><div class="form-campo-300"><label>Empresa relacionada *</label><select [(ngModel)]="form.empresaRelacionadaId" [disabled]="modo==='ver'"><option [ngValue]="0">Seleccione</option><option *ngFor="let e of empresas" [ngValue]="e.id">{{e.nombre}}</option></select></div><div class="form-campo-200"><label>Tipo *</label><select [(ngModel)]="form.tipo" [disabled]="modo==='ver'"><option value="PROVEEDOR">Proveedor</option><option value="CLIENTE">Cliente</option></select></div><div class="form-campo-200"><label>Fecha inicio</label><input type="date" [(ngModel)]="form.fechaInicio" [disabled]="modo==='ver'"></div><div class="form-campo-200"><label>Fecha fin</label><input type="date" [(ngModel)]="form.fechaFin" [disabled]="modo==='ver'"></div><div class="form-campo-500"><label>Observaciones</label><input maxlength="500" [(ngModel)]="form.observaciones" [disabled]="modo==='ver'"></div></div></div><datosMovimiento [mostrarTipo]="gestion" [mostrarCausa]="gestion" [tipo]="seleccion?.tipoMovimiento||''" [causa]="seleccion?.causaMovimiento||''" [usuario]="seleccion?.usuarioMovimiento||''" [fecha]="seleccion?.fechaMovimiento||''" [activo]="seleccion?.activa!==false"></datosMovimiento><div barraAcciones class="toolbar"><button *ngIf="modo!=='ver'" class="boton boton-accion accion-guardar" (click)="guardar()">Guardar</button><button class="boton boton-accion accion-cancelar" (click)="consultar()">{{modo==='ver'?'Volver':'Cancelar'}}</button></div></section>
<section *ngIf="vista==='historico'&&gestion" class="tabla-contenedor"><tabla titulo="HISTÓRICO DE RELACIÓN" claveConfiguracion="administracion.relacionesEmpresa.historico" [columnas]="historicoColumnas" [titulosColumnas]="historicoTitulos" [datos]="historicoDatos" [incluirBajas]="true"></tabla><div barraAcciones class="toolbar"><button class="boton boton-accion accion-volver" (click)="consultar()">Volver</button></div></section></main></div>
