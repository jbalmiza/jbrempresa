
<supbar></supbar>

<div class="menu"> 

	<sidebar modulo="administracion"></sidebar> 
	
<div class="pagina">

<label class="titulo"> REGISTRO DE CLIENTES </label>
	
<!-- MENU DE ACCIONES SOBRE EL REGISTRO  -->
<div class="toolbar">

  <button class="boton" (click)="consultar()"> Consultar </button>

  <button class="boton" (click)="insertar()"> Insertar </button>

  <button class="boton" (click)="modificar()"> Modificar </button>

  <button class="boton" (click)="eliminar()"> Eliminar </button>

  <button class="boton"> Importar </button>

  <button class="boton" (click)="exportar()"> Exportar </button>
    
  <button class="boton" (click)="volver()"> Volver </button>

</div>

		

<!-- FORMULARIO DE REGISTRO -->
<div *ngIf="pestanaActiva === 'registro'" class="form-contenedor">

  	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Identificación </label>

		<div class="form-fila">
			
			<div class="form-campo"> 
  				<label class="label">Id Cliente</label> 
  				<input type="number" [(ngModel)]="cliente.idCliente" name="idCliente" disabled>
  			</div>
  			
  		</div>
  		
  	</div>
  	
  	<div class="form-grupo"> 
  			
  	<label class="titulo"> Datos Cliente </label>

		<div class="form-fila">
  			
  			<div class="form-campo"> 
  				<label class="label"> Nombre <span class="obligatorio">*</span> </label> 
  				<input type="text" maxlength="50" [(ngModel)]="cliente.nombre" name="nombre"> 
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !cliente.nombre"> Valor Obligatorio </div>
  			</div>
  			
  			
  			
  		</div>
  		
  	</div>
  
  	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Movimiento </label>

		<div class="form-fila">

  			<div class="form-campo"> 
  				<label class="label">Usuario Movimiento</label> 
  				<input type="text" maxlength="50" [(ngModel)]="cliente.usuarioMovimiento" name="usuarioMovimiento" disabled> 
  			</div>
 			
  			<div class="form-campo"> 
  				<label class="label">Fecha Movimiento</label> 
  				<input type="datetime-local" maxlength="100" [(ngModel)]="cliente.fechaMovimiento" name="fechaMovimiento" disabled> 
  			</div>
  			
  			<div class="form-campo"> 
  				<label class="label">Activo</label> 
  				<input type="checkbox" maxlength="50" [(ngModel)]="cliente.activo" name="activo" disabled> 
  			</div>
  			
 		</div>
 	
 	</div>
 
	<div class="toolbar"> 
	
		<button class="boton" (click)="guardar()"> Guardar </button> 
		
		<!-- Botón Cancelar tiene misma lógica que insertar -->
		<button class="boton" (click)="insertar()"> Cancelar </button>
		
	</div>

</div>

<!-- TABLA DE RESULTADOS-->
<div *ngIf="pestanaActiva === 'tabla'" class="tabla-contenedor">

  	<label class="titulo"> TABLA DE CLIENTES </label>
    
  	<tabla 
  	
  		[columnas]="columnas" 
  		[titulosColumnas]="titulosColumnas"
  		[datos]="datos" 
		(filaSeleccionada)="clienteSeleccionado = $event"> 
  		
  	</tabla>
  	  
</div>

<!-- Cierres de div class menu y pagina -->
</div> </div>
