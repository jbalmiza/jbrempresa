
<supbar></supbar>

<div class="menu"> 

	<sidebar modulo="administracion"></sidebar> 
	
<div class="pagina">

<label class="titulo"> REGISTRO DE USUARIOS </label>
	
<!-- MENU DE ACCIONES SOBRE EL REGISTRO  -->
<div class="toolbar">

  <button class="boton" (click)="consultar()"> Consultar </button>

  <button class="boton" (click)="insertar()"> Insertar </button>

  <button class="boton" (click)="modificar()"> Modificar </button>

  <button class="boton" (click)="eliminar()"> Eliminar </button>

  <button class="boton"> Importar </button>

  <button class="boton" (click)="exportar()"> Exportar </button>
    
  <button class="boton" (click)="volver()"> Volver </button>

</div>

		

<!-- FORMULARIO DE REGISTRO -->
<div *ngIf="vistaActiva === 'registro'" class="form-contenedor">

  	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Identificación </label>

		<div class="form-fila">
			
			<div class="form-campo"> 
  				<label class="label">Id Cliente</label> 
  				<input type="number" [(ngModel)]="usuario.cliId" name="cliId" disabled>
  			</div>
			
  			<div class="form-campo"> 
  				<label class="label">Id Usuario</label> 
  				<input type="number" [(ngModel)]="usuario.usuId" name="usuId" disabled>
  			</div>
  			
  		</div>
  		
  	</div>
  	
  	<div class="form-grupo"> 
  			
  	<label class="titulo"> Datos Usuario </label>

		<div class="form-fila">
  			
  			<div class="form-campo-200"> 
  				<label class="label">Usuario <span class="obligatorio">*</span> </label> 
  				<input type="text" maxlength="50" [(ngModel)]="usuario.usuUsu" name="usuUsu"> 
				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !usuario.usuUsu"> Valor Obligatorio </div>
  			</div>

  			<div class="form-campo-200"> 
  				<label class="label">Contraseña <span class="obligatorio">*</span> </label> 
  				<input type="text" maxlength="255" [(ngModel)]="usuario.usuCon" name="usuCon"> 
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !usuario.usuCon"> Valor Obligatorio </div>
  			</div>
  			
  		</div>

		<div class="form-fila">	
  			  			
  			<div class="form-campo-200">
  				<label class="label">Id Perfil <span class="obligatorio">*</span> </label> 
  				<select [(ngModel)]="usuario.perId" name="perId"> 
  					<option [ngValue]="0" hidden>Seleccione...</option>
					<option *ngFor="let u of usuariosLista" [ngValue]="u.usuId"> {{ u.usuId }} </option>
				</select>
				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !usuario.perId"> Valor Obligatorio </div>
			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label">Nombre <span class="obligatorio">*</span> </label> 
  				<input type="text" maxlength="100" [(ngModel)]="usuario.usuNom" name="usuNom"> 
				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !usuario.usuNom"> Valor Obligatorio </div>
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label">Email <span class="obligatorio">*</span> </label> 
  				<input type="email" maxlength="100" [(ngModel)]="usuario.usuEma" name="usuEma"> 
				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !usuario.usuEma"> Valor Obligatorio </div>
  			</div>

  		</div>
  		
  	</div>
  
  	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Movimiento </label>

		<div class="form-fila">

  			<div class="form-campo-200"> 
  				<label class="label">Usuario Movimiento</label> 
  				<input type="text" maxlength="50" [(ngModel)]="usuario.usuUsuMov" name="usuUsuMov" disabled> 
  			</div>
 			
  			<div class="form-campo-200"> 
  				<label class="label">Fecha Movimiento</label> 
  				<input type="datetime-local" maxlength="100" [(ngModel)]="usuario.usuFecMov" name="usuFecMov" disabled> 
  			</div>
  			
  			<div class="form-campo"> 
  				<label class="label">Activo</label> 
  				<input type="checkbox" maxlength="50" [(ngModel)]="usuario.usuAct" name="usuAct" disabled> 
  			</div>
  			
 		</div>
 	
 	</div>
 
	<div class="toolbar"> 
	
		<button *ngIf="modoFormulario === 'insertar'" class="boton" (click)="guardar()"> Guardar </button>
		
		<button *ngIf="modoFormulario === 'modificar'" class="boton" (click)="actualizar()"> Actualizar </button>
		
		<!-- Botón Cancelar tiene misma lógica que insertar -->
		<button class="boton" (click)="insertar()"> Cancelar </button>
		
	</div>

</div>

<!-- TABLA DE RESULTADOS-->
<div *ngIf="vistaActiva === 'tabla'" class="tabla-contenedor">

  	<label class="titulo"> TABLA DE USUARIOS </label>
    
  	<tabla 
  	
  		[columnas]="columnas" 
  		[titulosColumnas]="titulosColumnas"
  		[datos]="datos" 
		(filaSeleccionada)="usuarioSeleccionado = $event"> 
  		
  	</tabla>
  	  
</div>

<!-- Cierres de div class menu y pagina -->
</div> </div>
