<supbar></supbar><div class="menu"><sidebar modulo="administracion"></sidebar><main class="pagina">
<label class="titulo">{{gestion?'GESTIÓN DE MÓDULOS':'REGISTRO DE MÓDULOS'}}</label>
<div barraAcciones class="toolbar"><button class="boton boton-accion accion-consultar" (click)="consultar()">Consultar</button><ng-container *ngIf="!gestion"><button class="boton boton-accion accion-insertar" (click)="insertar()">Insertar</button><button *ngIf="seleccionado" class="boton boton-accion accion-ver" (click)="ver()">Ver</button><button *ngIf="seleccionado" class="boton boton-accion accion-modificar" (click)="modificar()">Modificar</button><button *ngIf="seleccionado" class="boton boton-accion accion-adjuntos" (click)="adjuntos()">Adjuntos</button><button *ngIf="seleccionado" class="boton boton-accion accion-eliminar" (click)="eliminar()">Eliminar</button></ng-container><button class="boton boton-accion accion-volver" (click)="volver()">Volver</button></div>
<div *ngIf="vista==='tabla'&&!gestion" class="tabla-contenedor"><tabla titulo="TABLA DE MÓDULOS" [columnas]="columnas" [titulosColumnas]="titulos" [datos]="datos" (filtroSolicitado)="consultar()" (filaSeleccionada)="seleccionado=$event"></tabla></div>
<div *ngIf="vista==='tabla'&&gestion" class="form-contenedor"><div class="form-grupo"><label class="titulo">Empresa</label><div class="form-fila"><div class="form-campo-500"><label class="label">Empresa *</label><select [(ngModel)]="empresaGestionId" (ngModelChange)="datos=[]"><option [ngValue]="0">Seleccione una empresa</option><option *ngFor="let empresa of empresas" [ngValue]="empresa.empId">{{empresa.empId}} · {{empresa.empNom}}</option></select></div></div></div><div class="form-grupo"><label class="titulo">Disponibilidad y orden de módulos</label><div *ngFor="let m of datos;let i=index" class="form-fila"><div class="form-campo-200"><label class="label">Módulo</label><input [value]="m.titulo" disabled></div><div class="form-campo-200"><label class="label">Disponible</label><input type="checkbox" [(ngModel)]="m.disponible"></div><div class="toolbar"><button class="boton" [disabled]="i===0" (click)="mover(i,-1)">↑</button><button class="boton" [disabled]="i===datos.length-1" (click)="mover(i,1)">↓</button></div></div></div><div *ngIf="datos.length" barraAcciones class="toolbar"><button class="boton boton-accion accion-guardar" (click)="guardarGestion()">Guardar</button><button class="boton boton-accion accion-cancelar" (click)="cancelarGestion()">Cancelar</button></div></div>
<div *ngIf="vista==='formulario'" class="form-contenedor" [class.solo-lectura]="modo==='ver'"><datosIdentificacion [campos]="[{etiqueta:'Id Empresa',valor:empresaId},{etiqueta:'Id Módulo',valor:modulo.id}]"></datosIdentificacion><div class="form-grupo"><label class="titulo">Datos Módulo</label><div class="form-fila"><div class="form-campo-200"><label class="label">Código *</label><input [(ngModel)]="modulo.codigo" [disabled]="modo==='modificar'"></div><div class="form-campo-200"><label class="label">Título *</label><input [(ngModel)]="modulo.titulo"></div><div class="form-campo-500"><label class="label">Descripción *</label><input [(ngModel)]="modulo.descripcion"></div><div class="form-campo-200"><label class="label">Ruta *</label><input [(ngModel)]="modulo.ruta" [disabled]="modo==='modificar'"></div><div class="form-campo-200"><label class="label">Posición</label><input type="number" min="1" [(ngModel)]="modulo.posicion"></div></div></div><datosMovimiento [mostrarTipo]="false" [mostrarCausa]="false" [usuario]="modulo.usuario||''" [fecha]="modulo.fecha" [activo]="modulo.activo"></datosMovimiento><div barraAcciones class="toolbar"><button *ngIf="modo!=='ver'" class="boton boton-accion accion-guardar" (click)="guardar()">Guardar</button><button class="boton boton-accion accion-cancelar" (click)="vista='tabla'">{{modo==='ver'?'Volver':'Cancelar'}}</button></div></div>
<div *ngIf="vista==='adjuntos'" class="form-contenedor"><div class="form-grupo"><label class="titulo">Adjuntos · {{modulo.titulo}}</label><documentacionAdjunta modulo="ADMINISTRACION" tipoRegistro="MODULO" [registroId]="modulo.id" codigoRuta="RUTA_DOCUMENTOS_MODULOS" [permitirImagenPrincipal]="true"></documentacionAdjunta></div><div barraAcciones class="toolbar"><button class="boton boton-accion accion-volver" (click)="vista='tabla'">Volver</button></div></div>
</main></div>
