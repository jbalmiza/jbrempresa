<supbar></supbar><div class="menu"><sidebar [modulo]="perfil==='EMPLEADO'?'empleados':'comunicaciones'"></sidebar><main class="pagina"><label class="titulo">{{gestion?'GESTIÓN':'REGISTRO'}} DE AVISOS Y ALERTAS</label>
<div barraAcciones *ngIf="vista==='tabla'" class="toolbar"><button class="boton boton-accion accion-consultar" (click)="consultar()">Consultar</button><button *ngIf="seleccionado" class="boton boton-accion accion-ver" (click)="abrir('ver')">Ver</button><button *ngIf="!gestion" class="boton boton-accion accion-insertar" (click)="insertar()">Insertar</button><button *ngIf="!gestion&&seleccionado&&seleccionado.aviTipMov!=='B'" class="boton boton-accion accion-modificar" (click)="abrir('modificar')">Modificar</button><button *ngIf="!gestion&&seleccionado" class="boton boton-accion accion-eliminar" (click)="eliminar()">Eliminar</button><button *ngIf="gestion&&seleccionado&&seleccionado.aviTipMov!=='B'" class="boton boton-accion accion-baja" (click)="baja()">Baja</button><button *ngIf="gestion&&seleccionado&&seleccionado.aviTipMov==='B'" class="boton boton-accion accion-reactivar" (click)="reactivar()">Reactivar</button><button *ngIf="gestion&&seleccionado" class="boton boton-accion accion-historico" (click)="verHistorico()">Histórico</button><button class="boton boton-accion accion-volver" (click)="volver()">Volver</button></div>
<section *ngIf="vista==='registro'" class="form-contenedor" [class.solo-lectura]="modo==='ver'"><datosIdentificacion [campos]="gestion?[{etiqueta:'Id Empresa',valor:aviso.empId},{etiqueta:'Id Aviso',valor:aviso.aviId},{etiqueta:'Id Histórico',valor:aviso.aviIdHis}]:[{etiqueta:'Id Empresa',valor:aviso.empId},{etiqueta:'Id Aviso',valor:aviso.aviId}]"></datosIdentificacion><div class="form-grupo"><label class="titulo">Datos Aviso o Alerta</label><div class="form-fila"><div class="form-campo-200"><label class="label">Tipo *</label><select [(ngModel)]="aviso.aviTipo" [disabled]="modo==='ver'"><option value="AVISO">Aviso</option><option value="ALERTA">Alerta</option></select></div><div class="form-campo-200"><label class="label">Ubicación *</label><select [(ngModel)]="aviso.aviUbicacion" (ngModelChange)="configurarDestino()" [disabled]="modo==='ver'"><option *ngFor="let lugar of ubicaciones" [ngValue]="lugar.valor">{{lugar.nombre}}</option></select></div><div class="form-campo-500" *ngIf="aviso.aviUbicacion==='VENTANA'"><label class="label">Ventana *</label><select [(ngModel)]="aviso.aviVentana" [disabled]="modo==='ver'"><option *ngFor="let ventana of ventanasDisponibles" [ngValue]="ventana.ruta">{{ventana.nombre}}</option></select></div></div><div class="form-fila"><div class="form-campo-200"><label class="label">Emisor *</label><select [(ngModel)]="aviso.aviEmisor" (ngModelChange)="configurarDestino()" [disabled]="modo!=='insertar'"><option *ngFor="let emisor of emisores" [ngValue]="emisor">{{emisor | titlecase}}</option></select></div><div class="form-campo-200"><label class="label">Destinatario *</label><select [(ngModel)]="aviso.aviDestinatario" (ngModelChange)="configurarDestino()" [disabled]="modo==='ver'"><option *ngFor="let destino of destinatarios" [ngValue]="destino.valor">{{destino.nombre}}</option></select></div><div class="form-campo-200" *ngIf="(aviso.aviUbicacion==='MENSAJES'&&aviso.aviDestinatario==='EMPRESA')||(aviso.aviUbicacion==='VENTANA'&&aviso.aviEmisor==='ADMINISTRADOR')"><label class="label">Empresa destinataria *</label><select [(ngModel)]="aviso.aviDestEmpId" [disabled]="modo==='ver'"><option *ngIf="aviso.aviEmisor==='ADMINISTRADOR'&&aviso.aviDestinatario==='EMPRESA'" [ngValue]="null">Todas las empresas</option><option *ngFor="let empresa of empresasSeleccionables" [ngValue]="empresa.id">{{empresa.nombre}}</option></select></div></div><div class="form-fila"><div class="form-campo-500"><label class="label">Título *</label><input maxlength="150" [(ngModel)]="aviso.aviTitulo" [disabled]="modo==='ver'"><div class="mensaje-obligatorio" *ngIf="mostrarObligatorios&&!aviso.aviTitulo.trim()">Valor Obligatorio</div></div><div class="form-campo-500"><label class="label">Mensaje *</label><textarea maxlength="1000" [(ngModel)]="aviso.aviMensaje" [disabled]="modo==='ver'"></textarea><div class="mensaje-obligatorio" *ngIf="mostrarObligatorios&&!aviso.aviMensaje.trim()">Valor Obligatorio</div></div></div></div><div class="form-grupo"><label class="titulo">Periodo de publicación</label><div class="form-fila"><div class="form-campo-200"><label class="label">Fecha y hora de inicio</label><input type="datetime-local" step="1" [(ngModel)]="aviso.aviFecIni" [disabled]="modo==='ver'"></div><div class="form-campo-200"><label class="label">Fecha y hora de finalización</label><input type="datetime-local" step="1" [(ngModel)]="aviso.aviFecFin" [disabled]="modo==='ver'"></div></div></div><datosMovimiento [mostrarTipo]="gestion" [mostrarCausa]="gestion" [tipo]="aviso.aviTipMov" [causa]="aviso.aviCauMov" [usuario]="aviso.aviUsuMov" [fecha]="aviso.aviFecMov" [activo]="aviso.aviAct"></datosMovimiento><div barraAcciones class="toolbar"><button *ngIf="modo!=='ver'" class="boton boton-accion accion-guardar" (click)="guardar()">{{modo==='insertar'?'Guardar':'Actualizar'}}</button><button class="boton boton-accion" [class.accion-cancelar]="modo!=='ver'" [class.accion-volver]="modo==='ver'" (click)="vista='tabla'">{{modo==='ver'?'Volver':'Cancelar'}}</button></div></section>
<section *ngIf="vista==='tabla'" class="tabla-contenedor"><tabla [claveConfiguracion]="gestion?'gestion-avisos-alertas':'registro-avisos-alertas'" [titulo]="(gestion?'GESTIÓN':'TABLA')+' DE AVISOS Y ALERTAS'" [columnas]="columnasVista" [titulosColumnas]="titulos" [datos]="datosPresentacion" [columnasOcultasPorDefecto]="['aviEmisorEmpId','aviEmisorUsuId','aviDestEmpId']" (filtroSolicitado)="consultar()" (filaSeleccionada)="seleccionar($event)"></tabla></section>
<section *ngIf="vista==='historico'" class="tabla-contenedor"><label class="titulo">HISTÓRICO DE AVISO O ALERTA</label><tabla [titulo]="'HISTÓRICO'" [columnas]="columnas" [titulosColumnas]="titulos" [datos]="historicoPresentacion" [incluirBajas]="true"></tabla><div barraAcciones class="toolbar"><button class="boton boton-accion accion-volver" (click)="vista='tabla'">Volver</button></div></section></main></div>
