<supbar></supbar><div class="menu"><sidebar modulo="personas"></sidebar><main class="pagina"><label class="titulo">{{titulo}}</label><p class="utilidad">Gestiona información complementaria vinculada a las Personas del cliente.</p><div barraAcciones class="toolbar"><button class="boton boton-accion accion-consultar" (click)="consultar()">Consultar</button><button class="boton boton-accion accion-insertar" (click)="insertar()">Insertar</button><button *ngIf="vista==='tabla'&&seleccionado" class="boton boton-accion accion-modificar" (click)="modificar()">Modificar</button><button *ngIf="vista==='tabla'&&seleccionado" class="boton boton-accion accion-eliminar" (click)="eliminar()">Eliminar</button><button class="boton boton-accion accion-volver" (click)="volver()">Volver</button></div>
<div *ngIf="vista==='tabla'" class="tabla-contenedor"><tabla [titulo]="'TABLA DE '+titulo" [permitirImportar]="true" [permitirExportar]="true" [columnas]="columnas" [titulosColumnas]="titulos" [datos]="datos" (filaSeleccionada)="seleccionado=$event"></tabla></div>
<div *ngIf="vista==='registro'" class="form-contenedor"><section class="form-grupo"><label class="titulo">Datos Persona</label><datosPersonaRelacion [personas]="personas" [personaId]="registro.perId" (personaIdChange)="registro.perId=$event"></datosPersonaRelacion><datosPersonaRelacion *ngIf="tipo==='representantes'" [personas]="personas" [personaId]="registro.repPerId" etiqueta="Representante *" (personaIdChange)="registro.repPerId=$event"></datosPersonaRelacion><div *ngIf="tipo==='domicilios-notificacion'" class="form-fila"><div class="form-campo-500"><label class="label">Domicilio de notificación *</label><selectorBusqueda [datos]="domicilios" [idSeleccionado]="registro.domId" [campoDescripcion]="'domDir'" [campoId]="'domId'" (valorSeleccionado)="registro.domId=$event"></selectorBusqueda></div></div></section>
<section *ngIf="tipo==='representantes'" class="form-grupo"><label class="titulo">Datos de Representación</label><div class="form-fila"><div class="form-campo-200"><label class="label">Tipo *</label><select [(ngModel)]="registro.repTip"><option value="LEGAL">Legal</option><option value="AUTORIZADO">Autorizado</option><option value="TUTOR">Tutor</option><option value="APODERADO">Apoderado</option><option value="OTRO">Otro</option></select></div><div class="form-campo-200"><label class="label">Desde</label><input type="date" [(ngModel)]="registro.repFecDes"></div><div class="form-campo-200"><label class="label">Hasta</label><input type="date" [(ngModel)]="registro.repFecHas"></div><label class="check"><input type="checkbox" [(ngModel)]="registro.repPri"> Principal</label></div><div class="form-campo-500"><label class="label">Observaciones</label><textarea rows="3" maxlength="500" [(ngModel)]="registro.repObs"></textarea></div></section>
<section *ngIf="tipo==='domicilios-notificacion'" class="form-grupo"><label class="titulo">Datos de Notificación</label><div class="form-fila"><div class="form-campo-200"><label class="label">Tipo *</label><select [(ngModel)]="registro.donTip"><option value="POSTAL">Postal</option><option value="FISCAL">Fiscal</option><option value="ADMINISTRATIVA">Administrativa</option><option value="JUDICIAL">Judicial</option><option value="OTRA">Otra</option></select></div><div class="form-campo-200"><label class="label">Desde</label><input type="date" [(ngModel)]="registro.donFecDes"></div><div class="form-campo-200"><label class="label">Hasta</label><input type="date" [(ngModel)]="registro.donFecHas"></div><label class="check"><input type="checkbox" [(ngModel)]="registro.donPri"> Principal</label></div><div class="form-campo-500"><label class="label">Observaciones</label><textarea rows="3" maxlength="500" [(ngModel)]="registro.donObs"></textarea></div></section>
<section *ngIf="tipo==='domiciliaciones-bancarias'" class="form-grupo"><label class="titulo">Datos Bancarios</label><div class="form-fila"><div class="form-campo-200"><label class="label">Operación *</label><select [(ngModel)]="registro.dobTip"><option value="CARGO">Cargo</option><option value="ABONO">Abono</option></select></div><div class="form-campo-500"><label class="label">Titular *</label><input maxlength="150" [(ngModel)]="registro.dobTit"></div><div class="form-campo-500"><label class="label">IBAN *</label><input maxlength="42" [(ngModel)]="registro.dobIban" [placeholder]="modo==='modificar'?'Introduzca otro IBAN para cambiarlo':''"></div></div><div class="form-fila"><div class="form-campo-200"><label class="label">BIC</label><input maxlength="20" [(ngModel)]="registro.dobBic"></div><div class="form-campo-500"><label class="label">Referencia de mandato</label><input maxlength="100" [(ngModel)]="registro.dobRefMan"></div><div class="form-campo-200"><label class="label">Fecha mandato</label><input type="date" [(ngModel)]="registro.dobFecMan"></div><div class="form-campo-200"><label class="label">Estado</label><select [(ngModel)]="registro.dobEst"><option value="ACTIVA">Activa</option><option value="INACTIVA">Inactiva</option></select></div><label class="check"><input type="checkbox" [(ngModel)]="registro.dobPri"> Principal</label></div><p class="aviso-seguridad">El IBAN se almacena cifrado y solo se muestra enmascarado.</p></section>
<datosMovimiento *ngIf="modo==='modificar'" [mostrarTipo]="false" [mostrarCausa]="false" [usuario]="registro.repUsuMov||registro.donUsuMov||registro.dobUsuMov||''" [fecha]="registro.repFecMov||registro.donFecMov||registro.dobFecMov" [activo]="registro.repAct??registro.donAct??registro.dobAct??true"></datosMovimiento><div barraAcciones class="toolbar"><button class="boton boton-accion accion-guardar" (click)="guardar()">Guardar</button><button class="boton boton-accion accion-cancelar" (click)="consultar()">Cancelar</button></div></div></main></div>
