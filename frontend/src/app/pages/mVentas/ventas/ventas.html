
<supbar></supbar>

<div class="menu">
  
	<sidebar modulo="ventas"></sidebar>

<div class="pagina">

	<label class="titulo"> REGISTRO DE VENTAS </label>

<!-- MENU DE ACCIONES SOBRE EL REGISTRO  -->
<div class="toolbar">

  <button class="boton" (click)="consultar()"> Consultar </button>

  <button class="boton" (click)="insertar()"> Insertar </button>

  <button class="boton" (click)="modificar()"> Modificar </button>

  <button class="boton" (click)="eliminar()"> Eliminar </button>

  <button class="boton"> Importar </button>

  <button class="boton" (click)="exportar()"> Exportar </button>
    
  <button class="boton" (click)="volver()"> Volver </button>

</div>

<!-- FORMULARIO DE REGISTRO -->
<div *ngIf="vistaActiva === 'registro'" class="form-contenedor">

  	<div class="form-grupo"> 
  	
  		<label class="titulo"> Datos Identificación </label>

		<div class="form-fila">
		
  			<div class="form-campo"> 
  				<label class="label">Id Cliente</label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.cliId" name="cliId" disabled> 
  			</div>
		
  			<div class="form-campo"> 
  				<label class="label">Id Venta</label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.venId" name="venId" disabled> 
  			</div>

		</div>
	
	</div>
	
	<div class="form-grupo">
	
		<label class="titulo"> Datos Comprador / Vendedor </label>
	
 		<div class="form-fila"> 
 		
  			<div class="form-campo-500">
  				<label class="label"> Selector Vendedor <span class="obligatorio">*</span> </label> 
				    <selectorBusqueda
				        [datos]="personasLista"
				        [idSeleccionado]="venta.perIdVen"
				        [campoDescripcion]="'perNomCom'"
				        [campoId]="'perIdVen'"
				        (valorSeleccionado)="venta.perIdVen = $event">
				    </selectorBusqueda>
				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !venta.perIdVen"> Valor Obligatorio </div>
			</div>
 		
  			<div class="form-campo-500">
  				<label class="label"> Selector Comprador <span class="obligatorio">*</span> </label> 
				    <selectorBusqueda
				        [datos]="personasLista"
				        [idSeleccionado]="venta.perIdCom"
				        [campoDescripcion]="'perNomCom'"
				        [campoId]="'perIdCom'"
				        (valorSeleccionado)="venta.perIdCom = $event">
				    </selectorBusqueda>
				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !venta.perIdCom"> Valor Obligatorio </div>
			</div>
  			
  		</div>

  	</div>
	
	<div class="form-grupo">
	
	    <label class="titulo"> Detalle de la Venta </label>
	
		<tablaEdicion
		
		    [columnas]="columnasDetalle"
		
		    [titulosColumnas]="titulosColumnasDetalle"
		
		    [datos]="ventaDetalleLista"
		    
		    (insertarLinea)="insertarVentaDetalle()">
		
		    <!-- Columna Producto -->
		    <ng-template tablaColumna="proId" let-fila>
		
		        <selectorBusqueda
		
		            [datos]="productosLista"
		
		            [idSeleccionado]="fila.proId"
		
		            [campoDescripcion]="'proNom'"
		
		            [campoId]="'proId'"
		
		            (valorSeleccionado)="seleccionarProductoDetalle(fila, $event)">
		
		        </selectorBusqueda>
		
		    </ng-template>
		
		    <!-- Columna Cantidad -->
		    <ng-template tablaColumna="venDetCan" let-fila>
		
		        <input type="number" [(ngModel)]="fila.venDetCan" class="input-tabla"
		        (ngModelChange)="actualizarLinea(fila)">
		
		    </ng-template>
		
		    <!-- Columna Precio -->
		    <ng-template tablaColumna="venDetPre" let-fila>
		
		        <input type="number" [(ngModel)]="fila.venDetPre" class="input-tabla"
		        (ngModelChange)="actualizarLinea(fila)">
		
		    </ng-template>
		    
		    <!-- Columna Descuento -->
		    <ng-template tablaColumna="venDetDes" let-fila>
		
		        <input type="number" [(ngModel)]="fila.venDetDes" class="input-tabla"
		        (ngModelChange)="actualizarLinea(fila)">
		
		    </ng-template>
		    
		    <!-- Columna IVA -->
		    <ng-template tablaColumna="venDetIva" let-fila>
		
		        <input type="number" [(ngModel)]="fila.venDetIva" class="input-tabla"
		        (ngModelChange)="actualizarLinea(fila)">
		
		    </ng-template>
		
		    <!-- Columna Importe -->
		    <ng-template tablaColumna="venDetImp" let-fila>
		
		        <input type="number" [(ngModel)]="fila.venDetImp" class="input-tabla" 
		        (ngModelChange)="actualizarLinea(fila)" disabled>
		
		    </ng-template>
		
		    <!-- Columna Acción -->
		    <ng-template tablaColumna="accion" let-fila let-indice="indice">
		
		        <button class="boton" (click)="eliminarVentaDetalle(indice)"> Eliminar </button>
		
		    </ng-template>
		
		</tablaEdicion>
	
	</div>
	
	<div class="form-grupo"> 
  	
  		<label class="titulo"> Datos Importes </label>

		<div class="form-fila">
		
  			<div class="form-campo-200"> 
  				<label class="label"> Subtotal </label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.venImpSub" name="venImpSub" disabled> 
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Descuento </label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.venImpDes" name="venImpDes" disabled> 
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> I.V.A. <span class="obligatorio">*</span> </label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.venImpIva" name="venImpIva" disabled> 
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Total </label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.venImpTot" name="venImpTot" disabled> 
  			</div>
  			
  		</div>
  			
  		<div class="form-fila">
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Cobrado </label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.venImpCob" name="venImpCob" disabled> 
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Pendiente </label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.venImpPen" name="venImpPen" disabled> 
  			</div>
  			
  		</div>

	</div>
	
	<div class="form-grupo"> 
  	
  		<label class="titulo"> Datos Fechas </label>

		<div class="form-fila">
		
  			<div class="form-campo-200"> 
  				<label class="label"> Fecha Presupuesto </label> 
  				<input type="date" maxlength="10" [(ngModel)]="venta.venFecPre" name="venFecPre" disabled> 
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Fecha Pedido </label> 
  				<input type="date" maxlength="10" [(ngModel)]="venta.venFecPed" name="venFecPed" disabled> 
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Fecha Albarán </label> 
  				<input type="date" maxlength="10" [(ngModel)]="venta.venFecAlb" name="venFecAlb" disabled> 
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Fecha Factura </label> 
  				<input type="date" maxlength="10" [(ngModel)]="venta.venFecFac" name="venFecFac" disabled> 
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Fecha Cobro </label> 
  				<input type="date" maxlength="10" [(ngModel)]="venta.venFecCob" name="venFecCob" disabled> 
  			</div>
  			
  		</div>

	</div>

  	<div class="form-grupo"> 
  	
  		<label class="titulo"> Datos Movimiento </label>

		<div class="form-fila">

  			<div class="form-campo-200"> 
  				<label class="label">Usu. Mov.</label> 
  				<input type="text" maxlength="50" [(ngModel)]="venta.venUsuMov" name="venUsuMov" disabled> 
  			</div>
 			
  			<div class="form-campo-200"> 
  				<label class="label">Fec. Mov.</label> 
  				<input type="datetime-local" maxlength="10" [(ngModel)]="venta.venFecMov" name="venFecMov" disabled> 
  			</div>
  			
  			<div class="form-campo"> 
  				<label class="label">Activo</label> 
  				<input type="checkbox" maxlength="10" [(ngModel)]="venta.venAct" name="venAct" disabled> 
  			</div>
  			
 		</div>
 	
 	</div>
 
	<div class="toolbar"> 
	
		<button *ngIf="modoFormulario === 'insertar'" class="boton" (click)="guardar()"> Guardar </button>
		
		<button *ngIf="modoFormulario === 'modificar'" class="boton" (click)="actualizar()"> Actualizar </button>
		
		<!-- Botón Cancelar tiene misma lógica que insertar -->
		<button class="boton" (click)="insertar()"> Cancelar </button>
		
	</div>

</div>

<!-- TABLA DE RESULTADOS-->
<div *ngIf="vistaActiva === 'tabla'" class="tabla-contenedor">

  	<label class="titulo"> TABLA DE VENTAS </label>
  
  	<tabla 
  	
  		[columnas]="columnas" 
  		[titulosColumnas]="titulosColumnas"
  		[datos]="datos" 
		(filaSeleccionada)="ventaSeleccionada = $event"> 
  		
  	</tabla>

</div>

<!-- Cierres de div class menu y pagina -->
</div> </div>
