
<supbar></supbar>

<div class="menu">
  
	<sidebar modulo="ventas"></sidebar>

<div class="pagina">

	<label class="titulo"> REGISTRO DE VENTAS </label>

<!-- MENU DE ACCIONES SOBRE EL REGISTRO  -->
<div class="toolbar">

  <button class="boton" (click)="consultar()"> Consultar </button>

  <button class="boton" (click)="insertar()"> Insertar </button>

  <button class="boton" (click)="modificar()"> Modificar </button>

  <button class="boton" (click)="eliminar()"> Eliminar </button>

  <button class="boton"> Importar </button>

  <button class="boton" (click)="exportar()"> Exportar </button>
    
  <button class="boton" (click)="volver()"> Volver </button>

</div>

<!-- FORMULARIO DE REGISTRO -->
<div *ngIf="pestanaActiva === 'registro'" class="form-contenedor">

  	<div class="form-grupo"> 
  	
  		<label class="titulo"> Datos Identificación </label>

		<div class="form-fila">
		
  			<div class="form-campo"> 
  				<label class="label">Id Cliente</label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.idCliente" name="idCliente" disabled> 
  			</div>
		
  			<div class="form-campo"> 
  				<label class="label">Id Venta</label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.idVenta" name="idVenta" disabled> 
  			</div>

		</div>
	
	</div>
	
	<div class="form-grupo"> 
  	
  		<label class="titulo"> Datos Persona </label>

		<div class="form-fila">
		
  			<div class="form-campo"> 
  				<label class="label"> Id Persona <span class="obligatorio">*</span> </label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.idPersona" name="idPersona"> 
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !venta.idPersona"> Valor Obligatorio </div>
  			</div>
  			
  		</div>

	</div>
	
	<div class="form-grupo"> 
  	
  		<label class="titulo"> Datos Producto </label>

		<div class="form-fila">
		
  			<div class="form-campo"> 
  				<label class="label"> Id Producto <span class="obligatorio">*</span> </label> 
  				<input type="number" maxlength="10" [(ngModel)]="venta.idProducto" name="idProducto"> 
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !venta.idProducto"> Valor Obligatorio </div>
  			</div>
  			
  		</div>

	</div>

  	<div class="form-grupo"> 
  	
  		<label class="titulo"> Datos Movimiento </label>

		<div class="form-fila">

  			<div class="form-campo"> 
  				<label class="label">Usu. Mov.</label> 
  				<input type="text" maxlength="50" [(ngModel)]="venta.usuarioMovimiento" name="usuarioMovimiento" disabled> 
  			</div>
 			
  			<div class="form-campo"> 
  				<label class="label">Fec. Mov.</label> 
  				<input type="datetime-local" maxlength="10" [(ngModel)]="venta.fechaMovimiento" name="fechaMovimiento" disabled> 
  			</div>
  			
  			<div class="form-campo"> 
  				<label class="label">Activo</label> 
  				<input type="checkbox" maxlength="10" [(ngModel)]="venta.activo" name="activo" disabled> 
  			</div>
  			
 		</div>
 	
 	</div>
 
	<div class="toolbar"> 
	
		<button class="boton" (click)="guardar()"> Guardar </button> 
		
		<!-- Botón Cancelar tiene misma lógica que insertar -->
		<button class="boton" (click)="insertar()"> Cancelar </button>
		
	</div>

</div>

<!-- TABLA DE RESULTADOS-->
<div *ngIf="pestanaActiva === 'tabla'" class="tabla-contenedor">

  	<label class="titulo"> TABLA DE VENTAS </label>
  
  	<tabla 
  	
  		[columnas]="columnas" 
  		[titulosColumnas]="titulosColumnas"
  		[datos]="datos" 
		(filaSeleccionada)="ventaSeleccionada = $event"> 
  		
  	</tabla>

</div>

<!-- Cierres de div class menu y pagina -->
</div> </div>
