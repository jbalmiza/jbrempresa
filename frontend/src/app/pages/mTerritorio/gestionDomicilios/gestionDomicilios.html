
<supbar></supbar>

<div class="menu">
  
	<sidebar modulo="territorio"></sidebar>

<div class="pagina">

	<label class="titulo"> GESTIÓN DE DOMICILIOS </label>

<!-- MENU DE ACCIONES SOBRE EL REGISTRO  -->
<div barraAcciones *ngIf="vistaActiva !== 'historico'" class="toolbar">

  	<button class="boton boton-accion accion-mapa" (click)="mapa()"> Mapa </button>
  	
  	<button class="boton boton-accion accion-consultar" (click)="consultar()"> Consultar </button>

	<button *ngIf="domicilioSeleccionado" class="boton boton-accion accion-ver" (click)="ver()"> Ver </button>

	<button *ngIf="domicilioSeleccionado && domicilioSeleccionado.domTipMov !== 'B'" class="boton boton-accion accion-modificar" (click)="modificar()"> Modificar </button>

    <button *ngIf="domicilioSeleccionado && domicilioSeleccionado.domTipMov !== 'B'" class="boton boton-accion accion-baja" (click)="baja()"> Baja </button>

	<button *ngIf="domicilioSeleccionado?.domTipMov === 'B'" class="boton boton-accion accion-reactivar" (click)="reactivar()"> Reactivar </button>

	<button *ngIf="domicilioSeleccionado" class="boton boton-accion accion-eliminar" (click)="eliminar()"> Eliminar </button>

	<button *ngIf="domicilioSeleccionado" class="boton boton-accion accion-adjuntos" (click)="adjuntos()"> Adjuntos </button>

	<button *ngIf="domicilioSeleccionado" class="boton boton-accion accion-historico" (click)="historico()"> Histórico </button>

	<button *ngIf="domicilioSeleccionado" class="boton boton-accion accion-agenda" (click)="agenda()"> Agenda </button>
    
  	<button class="boton boton-accion accion-volver" (click)="volver()"> Volver </button>

</div>

<!-- MAPA DE REGISTROS -->
<div *ngIf="vistaActiva === 'mapa'" class="form-contenedor mapa-gestion">

	<mapaRegistros
    	[obtenerRegistros]="obtenerDomicilios"
	    campoTitulo="domDir"
	    campoX="domCoX"
	    campoY="domCoY"
	    campoEpsg="domHus"
	    (registroSeleccionado)="abrirDomicilioDesdeMapa($event)">
	</mapaRegistros>
	
</div>

<!-- FORMULARIO DE REGISTRO -->
<div *ngIf="vistaActiva === 'registro'" class="form-contenedor" [class.solo-lectura]="modoFormulario === 'ver'">
	<p *ngIf="modoFormulario === 'ver'" class="modo-ver-aviso">Vista de consulta. Los campos no se pueden modificar.</p>

  	<datosIdentificacion [campos]="[{etiqueta:'Id Empresa',valor:domicilio.empId},{etiqueta:'Id Domicilio',valor:domicilio.domId},{etiqueta:'Id Histórico',valor:domicilio.domIdHis}]"></datosIdentificacion>
  			
  	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Domicilio </label>

		<div class="form-fila">
		
		  	<div class="form-campo-200"> 
  				<label class="label"> C.I.V. <span class="obligatorio">*</span> </label> 
  				<input type="text" maxlength="100" [(ngModel)]="domicilio.domCiv" name="domDir"> 
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !domicilio.domCiv"> Valor Obligatorio </div>
  			</div>
  			
  		</div>
  			
  		<div class="form-fila">

  			<div class="form-campo"> 
  				<label class="label"> Tipo Vía <span class="obligatorio">*</span> </label> 
				<input type="text" [(ngModel)]="domicilio.domTipVia" name="domTipVia" disabled>
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !domicilio.domTipVia"> Valor Obligatorio </div>
  			</div>

  			<div class="form-campo-200"> 
  				<label class="label"> Vía <span class="obligatorio">*</span> </label> 
				<select [(ngModel)]="domicilio.domViaId" name="domViaId" (ngModelChange)="seleccionarVia()"><option [ngValue]="null" hidden>Seleccione...</option><option *ngFor="let via of vias" [ngValue]="via.viaId">{{via.viaTip}} {{via.viaNom}}</option></select>
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !domicilio.domVia"> Valor Obligatorio </div>
  			</div>
		
  			<div class="form-campo"> 
  				<label class="label"> Número <span class="obligatorio">*</span> </label> 
  				<input type="number" maxlength="10" [(ngModel)]="domicilio.domNum" name="domNum" (ngModelChange)="actualizarDireccion()"> 
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !domicilio.domNum"> Valor Obligatorio </div>
  			</div>
  			
  		</div>

		<div class="form-fila">
  			
  			<div class="form-campo"> 
  				<label class="label">Km</label> 
  				<input type="text" maxlength="10" [(ngModel)]="domicilio.domKm" name="domKm" (ngModelChange)="actualizarDireccion()"> 
  			</div>

  			<div class="form-campo"> 
  				<label class="label">Edificio</label> 
  				<input type="text" maxlength="10" [(ngModel)]="domicilio.domEdi" name="domEdi" (ngModelChange)="actualizarDireccion()"> 
  			</div>
  			
  			<div class="form-campo"> 
  				<label class="label">Bloque</label> 
				<select [(ngModel)]="domicilio.domBlo" name="domBlo" (ngModelChange)="actualizarDireccion()"><option value=""></option><option *ngFor="let opcion of opcionesCinco" [value]="opcion">{{opcion}}</option></select>
  			</div>
  			
  			<div class="form-campo"> 
  				<label class="label">Portal</label> 
				<select [(ngModel)]="domicilio.domPor" name="domPor" (ngModelChange)="actualizarDireccion()"><option value=""></option><option *ngFor="let opcion of opcionesCinco" [value]="opcion">{{opcion}}</option></select>
  			</div>
  			  			
  			<div class="form-campo"> 
  				<label class="label">Escalera</label> 
				<select [(ngModel)]="domicilio.domEsc" name="domEsc" (ngModelChange)="actualizarDireccion()"><option value=""></option><option *ngFor="let opcion of opcionesCinco" [value]="opcion">{{opcion}}</option></select>
  			</div>
  			
  			<div class="form-campo"> 
  				<label class="label">Planta</label> 
				<select [(ngModel)]="domicilio.domPla" name="domPla" (ngModelChange)="actualizarDireccion()"><option value=""></option><option *ngFor="let opcion of opcionesCinco" [value]="opcion">{{opcion}}</option></select>
  			</div>
  			  			
  			<div class="form-campo"> 
  				<label class="label">Puerta</label> 
  				<input type="text" maxlength="10" [(ngModel)]="domicilio.domPue" name="domPue" (ngModelChange)="actualizarDireccion()"> 
  			</div>
  			
  		</div>
  		
  		<div class="form-fila">
  			  			
  			<div class="form-campo"> 
  				<label class="label"> C.P. <span class="obligatorio">*</span> </label> 
				<input type="text" [(ngModel)]="domicilio.domCp" name="domCp" disabled>
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !domicilio.domCp"> Valor Obligatorio </div>
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Municipio <span class="obligatorio">*</span> </label> 
				<input type="text" [(ngModel)]="domicilio.domMun" name="domMun" disabled>
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !domicilio.domMun"> Valor Obligatorio </div>
  			</div>
  			  			
  			<div class="form-campo-200"> 
  				<label class="label"> Provincia <span class="obligatorio">*</span> </label> 
				<input type="text" [(ngModel)]="domicilio.domPro" name="domPro" disabled>
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !domicilio.domPro"> Valor Obligatorio </div>
  			</div>
  			
  		</div>
  		
  		<div class="form-fila">
  			  			
  			<div class="form-campo-500"> 
  				<label class="label">Observaciones</label> 
  				<input type="text" maxlength="100" [(ngModel)]="domicilio.domObs" name="domObs" (ngModelChange)="actualizarDireccion()"> 
  			</div>
  			
  		</div>

	</div>
	
	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Dirección </label>

		<div class="form-fila">

  			<div class="form-campo-500"> 
  				<label class="label">Dirección Postal</label> 
  				<input type="text" maxlength="100" [(ngModel)]="domicilio.domDir" name="domDir"> 
  			</div>
 		
 		</div>
 	
 	</div>
 	
 	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Ubicación </label>

		<div class="form-fila">

  			<div class="form-campo-200"> 
  				<label class="label"> Coordenada X </label> 
  				<input type="number" maxlength="100" [(ngModel)]="domicilio.domCoX" name="domCoX" disabled> 
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Coordenada Y </label> 
  				<input type="number" maxlength="100" [(ngModel)]="domicilio.domCoY" name="domCoY" disabled> 
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Huso UTM </label> 
  				<input type="number" maxlength="100" [(ngModel)]="domicilio.domHus" name="domHus" disabled> 
  			</div>
  			
			<div class="form-campo-200">
			    <label class="label"> Mapa </label>
			    <selectorMapa
   					[(x)]="domicilio.domCoX"
					[(y)]="domicilio.domCoY"
    				[(epsg)]="domicilio.domHus">
				</selectorMapa>
			</div>
 		
 		</div>
 	
 	</div>

	<datosMovimiento [tipo]="domicilio.domTipMov||''" [causa]="domicilio.domCauMov||''" [usuario]="domicilio.domUsuMov||''" [fecha]="domicilio.domFecMov" [activo]="domicilio.domAct"></datosMovimiento>
 
	<div barraAcciones class="toolbar"> 
	
		<button *ngIf="modoFormulario === 'insertar'" class="boton" (click)="guardar()"> Guardar </button>
		
		<button *ngIf="modoFormulario === 'modificar'" class="boton" (click)="actualizar()"> Actualizar </button> 
		
		<!-- Botón Cancelar tiene misma lógica que consultar -->
		<button class="boton" (click)="consultar()"> Cancelar </button>
		
	</div>

</div>

<div *ngIf="vistaActiva === 'agenda'" class="form-contenedor">
	<agendaRegistros [titulo]="'Agenda · ' + (domicilioSeleccionado?.domDir || '')"
		[tipoRecurso]="'DOMICILIO'" [referenciaId]="domicilioSeleccionado?.domId || 0"
		[nombreRecurso]="domicilioSeleccionado?.domDir || ''" [intervaloMinutos]="5"></agendaRegistros>
	<div barraAcciones class="toolbar"><button class="boton boton-accion accion-volver" (click)="mapa()">Volver al mapa</button></div>
</div>

<div *ngIf="vistaActiva === 'adjuntos'" class="form-contenedor">
	<div class="form-grupo">
		<label class="titulo">Documentación Adjunta · {{ domicilioSeleccionado?.domDir }}</label>
		<documentacionAdjunta [modulo]="'DOMICILIOS'" [tipoRegistro]="'DOMICILIO'"
			[registroId]="domicilioSeleccionado?.domId || 0" [codigoRuta]="'RUTA_DOCUMENTOS_DOMICILIOS'">
		</documentacionAdjunta>
	</div>
	<div barraAcciones class="toolbar"><button class="boton boton-accion accion-volver" (click)="volverAConsulta()">Volver a consulta</button></div>
</div>

<div *ngIf="vistaActiva === 'historico'" class="tabla-contenedor">
	<label class="titulo">HISTÓRICO DE DOMICILIO · {{ domicilioSeleccionado?.domDir }}</label>
	<div barraAcciones class="toolbar">
		<button class="boton boton-accion accion-volver" (click)="volverAConsulta()">Volver</button>
		<button *ngIf="(domicilioSeleccionado?.domIdHis || 1) > 1" class="boton" (click)="deshacer()">Deshacer</button>
	</div>
	<tabla [columnas]="columnas" [titulosColumnas]="titulosColumnas" [incluirBajas]="true" [datos]="datosHistorico"></tabla>
</div>

<!-- TABLA DE RESULTADOS-->
<div *ngIf="vistaActiva === 'tabla'" class="tabla-contenedor">

  	<tabla 
  	
		titulo="TABLA DE DOMICILIOS"
		[permitirImportar]="true"
		[permitirExportar]="true"
		(exportarSolicitado)="exportar()"
  		[columnas]="columnas" 
  		[titulosColumnas]="titulosColumnas"
  		[datos]="datos" 
		(filaSeleccionada)="seleccionarDomicilio($event)"> 
  		
  	</tabla>

</div>

<!-- Cierres de div class menu y pagina -->
</div> </div>
