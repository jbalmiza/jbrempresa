<supbar></supbar><div class="menu"><sidebar modulo="territorio"></sidebar><div class="pagina"><label class="titulo">{{titulo}}</label>
<div barraAcciones class="toolbar"><button class="boton boton-accion accion-consultar" (click)="consultar()">Consultar</button><button class="boton boton-accion accion-insertar" (click)="insertar()">Insertar</button><button *ngIf="vistaActiva==='tabla'&&seleccionado" class="boton boton-accion accion-modificar" (click)="modificar()">Modificar</button><button *ngIf="vistaActiva==='tabla'&&seleccionado" class="boton boton-accion accion-eliminar" (click)="eliminar()">Eliminar</button><button class="boton boton-accion accion-volver" (click)="volver()">Volver</button></div>
<div *ngIf="vistaActiva==='tabla'" class="tabla-contenedor"><tabla [columnas]="columnas" [titulosColumnas]="titulosColumnas" [datos]="datos" (filaSeleccionada)="seleccionado=$event"></tabla></div>
<div *ngIf="vistaActiva==='registro'" class="form-contenedor"><div class="form-grupo"><label class="titulo">Datos del registro</label><div class="form-fila">
 <div class="form-campo"><label class="label">Empresa</label><input [(ngModel)]="registro.empId" disabled></div>
 <div *ngIf="tipo==='provincias'" class="form-campo-500"><label class="label">País *</label><select [(ngModel)]="registro.paiId"><option [ngValue]="0" hidden>Seleccione...</option><option *ngFor="let x of paises" [ngValue]="x.paiId">{{x.paiNom}}</option></select></div>
 <div *ngIf="tipo==='municipios'" class="form-campo-500"><label class="label">Provincia *</label><select [(ngModel)]="registro.prvId"><option [ngValue]="0" hidden>Seleccione...</option><option *ngFor="let x of provincias" [ngValue]="x.prvId">{{x.prvNom}}</option></select></div>
 <div *ngIf="tipo==='codigos-postales'" class="form-campo-500"><label class="label">Municipio *</label><select [(ngModel)]="registro.munId"><option [ngValue]="0" hidden>Seleccione...</option><option *ngFor="let x of municipios" [ngValue]="x.munId">{{x.munNom}}</option></select></div>
 <div *ngIf="tipo==='vias'" class="form-campo-500"><label class="label">Código postal *</label><select [(ngModel)]="registro.copId"><option [ngValue]="0" hidden>Seleccione...</option><option *ngFor="let x of codigos" [ngValue]="x.copId">{{x.copCod}}</option></select></div>
 <div *ngIf="tipo==='vias'" class="form-campo-200"><label class="label">Tipo de vía *</label><select [(ngModel)]="registro.viaTip"><option value="" hidden>Seleccione...</option><option *ngFor="let x of tiposVia" [value]="x">{{x}}</option></select></div>
</div><div class="form-fila"><div class="form-campo-200"><label class="label">Código *</label><input maxlength="30" [(ngModel)]="registro.paiCod" *ngIf="tipo==='paises'"><input maxlength="30" [(ngModel)]="registro.prvCod" *ngIf="tipo==='provincias'"><input maxlength="30" [(ngModel)]="registro.munCod" *ngIf="tipo==='municipios'"><input maxlength="10" [(ngModel)]="registro.copCod" *ngIf="tipo==='codigos-postales'"><input maxlength="30" [(ngModel)]="registro.viaCod" *ngIf="tipo==='vias'"></div><div *ngIf="tipo!=='codigos-postales'" class="form-campo-500"><label class="label">Nombre *</label><input maxlength="150" [(ngModel)]="registro.paiNom" *ngIf="tipo==='paises'"><input maxlength="150" [(ngModel)]="registro.prvNom" *ngIf="tipo==='provincias'"><input maxlength="150" [(ngModel)]="registro.munNom" *ngIf="tipo==='municipios'"><input maxlength="150" [(ngModel)]="registro.viaNom" *ngIf="tipo==='vias'"></div></div></div>
<div barraAcciones class="toolbar"><button class="boton boton-accion accion-guardar" (click)="guardar()">Guardar</button><button class="boton boton-accion accion-cancelar" (click)="cancelar()">Cancelar</button></div></div></div></div>
