<supbar></supbar><div class="menu"><sidebar [modulo]="modulo"></sidebar><main class="pagina"><label class="titulo">{{titulo}}</label>
<div barraAcciones *ngIf="vistaActiva==='tabla'" class="toolbar"><button class="boton boton-accion accion-consultar" (click)="consultar()">Consultar</button><button class="boton boton-accion accion-ver" (click)="abrir('ver')">Ver</button><button class="boton boton-accion accion-insertar" (click)="insertar()">Insertar</button><button *ngIf="seleccionado" class="boton boton-accion accion-modificar" (click)="abrir('modificar')">Modificar</button><button *ngIf="seleccionado" class="boton boton-accion accion-eliminar" (click)="eliminar()">Eliminar</button><button *ngIf="seleccionado" class="boton boton-accion accion-adjuntos" (click)="adjuntos()">Adjuntos</button><button class="boton boton-accion accion-volver" (click)="volver()">Volver</button></div>
<section *ngIf="vistaActiva==='registro'" class="form-contenedor"><datosIdentificacion [campos]="[{etiqueta:'Id Tipo',valor:tipo.id}]"></datosIdentificacion><div class="form-grupo"><label class="titulo">Datos Tipo</label><div class="form-fila"><div class="form-campo-200"><label class="label">Nombre <span class="obligatorio">*</span></label><input maxlength="80" [(ngModel)]="tipo.nombre" [disabled]="modoFormulario==='ver'"><div class="mensaje-obligatorio" *ngIf="mostrarObligatorios&&!tipo.nombre.trim()">Valor Obligatorio</div></div></div></div><datosMovimiento [mostrarTipo]="false" [mostrarCausa]="false" [usuario]="tipo.usuario||''" [fecha]="tipo.fecha" [activo]="tipo.activo"></datosMovimiento><div barraAcciones class="toolbar"><button *ngIf="modoFormulario!=='ver'" class="boton boton-accion accion-guardar" (click)="guardar()">{{modoFormulario==='insertar'?'Guardar':'Actualizar'}}</button><button class="boton boton-accion accion-cancelar" (click)="consultar()">Cancelar</button></div></section>
<section *ngIf="vistaActiva==='adjuntos'" class="form-contenedor"><div class="form-grupo"><label class="titulo">Documentación Adjunta · {{seleccionado?.nombre}}</label><documentacionAdjunta [modulo]="clase==='PRODUCTO'?'PRODUCTOS':'SERVICIOS'" [tipoRegistro]="clase==='PRODUCTO'?'TIPO_PRODUCTO':'TIPO_SERVICIO'" [registroId]="seleccionado?.id||0" [codigoRuta]="clase==='PRODUCTO'?'RUTA_DOCUMENTOS_PRODUCTOS':'RUTA_DOCUMENTOS_SERVICIOS'" [permitirImagenPrincipal]="true"></documentacionAdjunta></div><div barraAcciones class="toolbar"><button class="boton boton-accion accion-volver" (click)="consultar()">Volver a consulta</button></div></section>
<section *ngIf="vistaActiva==='tabla'" class="tabla-contenedor"><tabla [titulo]="'TABLA DE TIPOS DE '+clase" [columnas]="columnas" [titulosColumnas]="titulosColumnas" [datos]="tipos" (filaSeleccionada)="seleccionado=$event"></tabla></section></main></div>
