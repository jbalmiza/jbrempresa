<supbar></supbar>
<div class="menu">
  <sidebar modulo="recursos"></sidebar>
  <main class="pagina">
    <h1 class="titulo">GESTIÓN DE AGENDAS</h1>
    <div class="toolbar acciones-principales">
      <button type="button" class="boton boton-accion accion-consultar" [disabled]="panel==='calendario'" (click)="panel='calendario'">Consultar</button>
      <button type="button" class="boton boton-accion accion-modificar" [disabled]="panel==='configuracion'||!agendas.length" (click)="abrirConfiguracion()">Configurar</button>
    </div>
    <section *ngIf="panel==='configuracion'" class="planificador configuracion-global" aria-label="Configuración global de agendas">
      <header><h2>Configuración global</h2><p>Los cambios sustituyen la configuración y el horario semanal de todos los empleados.</p></header>
      <configuracionAgenda [recursos]="recursosConfiguracion" tipoRecurso="EMPLEADO" (guardado)="configuracionGuardada()" (cancelar)="panel='calendario'"></configuracionAgenda>
    </section>
    <p *ngIf="panel==='calendario' && cargando" class="mensaje">Cargando agendas…</p>
    <p *ngIf="panel==='calendario' && mensaje" class="mensaje error">{{mensaje}}</p>
    <agendaRegistros *ngIf="panel==='calendario' && !cargando && agendas.length"
      titulo="Agendas de empleados"
      [agendasMultiples]="agendas"
      [reservasMultiples]="reservas"
      [fechaGestion]="fecha"
      [permitirGestion]="false"
      [permitirAccionesTarea]="true"
      (fechaGestionChange)="cambiarFechaComun($event)"
      (estadoTarea)="cambiarEstadoComun($event)"
      (pagarPedido)="cambiarPagoComun($event)"></agendaRegistros>
    <p *ngIf="panel==='calendario' && !cargando && !agendas.length" class="vacio">No hay agendas de empleados configuradas.</p>
  </main>
</div>
