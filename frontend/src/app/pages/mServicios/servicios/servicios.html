<supbar></supbar><div class="menu"><sidebar modulo="servicios"></sidebar><div class="pagina">
<label class="titulo">{{ modoGestion ? 'GESTIÓN DE SERVICIOS' : 'REGISTRO DE SERVICIOS' }}</label>
<div barraAcciones *ngIf="vistaActiva!=='historico'" class="toolbar">
 <button class="boton boton-accion accion-consultar" (click)="consultar()">Consultar</button><button *ngIf="!modoGestion" class="boton boton-accion accion-insertar" (click)="insertar()">Insertar</button>
 <button *ngIf="vistaActiva==='tabla'&&seleccionada" class="boton boton-accion accion-ver" (click)="ver()">Ver</button>
 <button *ngIf="vistaActiva==='tabla'&&seleccionada&&seleccionada.serTipMov!=='B'" class="boton boton-accion accion-modificar" (click)="modificar()">Modificar</button>
 <button *ngIf="modoGestion&&vistaActiva==='tabla'&&seleccionada?.serTipMov!=='B'" class="boton boton-accion accion-baja" (click)="baja()">Baja</button>
 <button *ngIf="vistaActiva==='tabla'&&seleccionada" class="boton boton-accion accion-eliminar" (click)="eliminar()">Eliminar</button>
 <button *ngIf="modoGestion&&vistaActiva==='tabla'&&seleccionada?.serTipMov==='B'" class="boton boton-accion accion-reactivar" (click)="reactivar()">Reactivar</button>
 <button *ngIf="vistaActiva==='tabla'&&seleccionada" class="boton boton-accion accion-adjuntos" (click)="adjuntos()">Adjuntos</button><button *ngIf="modoGestion&&vistaActiva==='tabla'&&seleccionada" class="boton boton-accion accion-historico" (click)="historico()">Histórico</button><button class="boton boton-accion accion-volver" (click)="volver()">Volver</button>
</div>
<div *ngIf="vistaActiva==='registro'" class="form-contenedor" [class.solo-lectura]="modo==='ver'"><p *ngIf="modo==='ver'" class="modo-ver-aviso">Vista de consulta. Los campos no se pueden modificar.</p>
 <datosIdentificacion [campos]="modoGestion ? [{etiqueta:'Id Empresa',valor:servicio.empId},{etiqueta:'Id Servicio',valor:servicio.serId},{etiqueta:'Id Histórico',valor:servicio.serIdHis}] : [{etiqueta:'Id Empresa',valor:servicio.empId},{etiqueta:'Id Servicio',valor:servicio.serId}]"></datosIdentificacion>
 <div class="form-grupo"><label class="titulo">Datos Servicio</label><div class="form-fila"><div class="form-campo-200"><label class="label">Tipo Servicio *</label><select [(ngModel)]="servicio.serTipSer" [disabled]="modo==='ver'"><option value="">Seleccione</option><option *ngFor="let tipo of tiposServicio" [value]="tipo.nombre">{{tipo.nombre}}</option></select></div><div class="form-campo-200"><label class="label">Nombre *</label><input maxlength="100" [(ngModel)]="servicio.serNom"></div><div class="form-campo-500"><label class="label">Descripción</label><input maxlength="500" [(ngModel)]="servicio.serDes"></div></div></div>
 <div class="form-grupo"><label class="titulo">Datos Clasificación y Tiempo</label><div class="form-fila"><div class="form-campo-200"><label class="label">Categoría *</label><input [(ngModel)]="servicio.serCat"></div><div class="form-campo-200"><label class="label">Subcategoría</label><input [(ngModel)]="servicio.serSubCat"></div><div class="form-campo-200"><label class="label">Duración (minutos) *</label><input type="number" min="5" step="5" [(ngModel)]="servicio.serDurMin"></div></div></div>
 <div class="form-grupo"><label class="titulo">Datos Económicos</label><div class="form-fila"><div class="form-campo-200"><label class="label">Precio Venta *</label><input type="number" [(ngModel)]="servicio.serPreVen" (input)="calcular()"></div><div class="form-campo"><label class="label">Descuento</label><input type="number" [(ngModel)]="servicio.serPreDes" (input)="calcular()"></div><div class="form-campo"><label class="label">IVA *</label><input type="number" [(ngModel)]="servicio.serPreIva" (input)="calcular()"></div><div class="form-campo-200"><label class="label">Precio Final</label><input type="number" [(ngModel)]="servicio.serPreFin" disabled></div></div></div>
 <div class="form-grupo"><label class="titulo">Datos Adicionales</label><div class="form-fila"><div class="form-campo-500"><label class="label">Observaciones</label><input maxlength="500" [(ngModel)]="servicio.serObs"></div><div class="form-campo-200"><label class="label">Visible en catálogo</label><input type="checkbox" [(ngModel)]="servicio.serVisCat"></div></div></div>
 <datosMovimiento [mostrarTipo]="modoGestion" [mostrarCausa]="modoGestion" [tipo]="servicio.serTipMov" [causa]="servicio.serCauMov" [usuario]="servicio.serUsuMov||''" [fecha]="servicio.serFecMov" [activo]="servicio.serAct"></datosMovimiento>
<div barraAcciones class="toolbar"><button class="boton boton-accion accion-guardar" (click)="guardar()">Guardar</button><button class="boton boton-accion accion-cancelar" (click)="consultar()">Cancelar</button></div>
</div>
<div *ngIf="vistaActiva==='adjuntos'" class="form-contenedor"><div class="form-grupo"><label class="titulo">Documentación Adjunta · {{seleccionada?.serNom}}</label><documentacionAdjunta modulo="SERVICIOS" tipoRegistro="SERVICIO" [registroId]="seleccionada?.serId||0" codigoRuta="RUTA_DOCUMENTOS_SERVICIOS" [permitirImagenPrincipal]="true"></documentacionAdjunta></div><div barraAcciones class="toolbar"><button class="boton boton-accion accion-volver" (click)="volverConsulta()">Volver a consulta</button></div></div>
<div *ngIf="vistaActiva==='historico'" class="tabla-contenedor"><label class="titulo">HISTÓRICO DE SERVICIO · {{seleccionada?.serNom}}</label><div barraAcciones class="toolbar"><button class="boton" (click)="volverConsulta()">Volver</button><button *ngIf="(seleccionada?.serIdHis||1)>1" class="boton" (click)="deshacer()">Deshacer</button></div><tabla [columnas]="columnas" [titulosColumnas]="titulosColumnas" [incluirBajas]="true" [datos]="datosHistorico"></tabla></div>
<div *ngIf="vistaActiva==='tabla'" class="tabla-contenedor"><tabla titulo="TABLA DE SERVICIOS" [permitirImportar]="true" [permitirExportar]="true" (exportarSolicitado)="exportar()" [columnas]="columnas" [titulosColumnas]="titulosColumnas" [datos]="datos" (filaSeleccionada)="seleccionada=$event"></tabla></div>
</div></div>
