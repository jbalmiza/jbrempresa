<supbar></supbar>
<main class="inicio">
  <section class="modulos-seccion">
    <div class="seccion-cabecera"><div><h2>Módulos de Gestión</h2><p>Accede a los módulos disponibles para tu empresa.</p></div></div>
    <div class="modules-container">
      <button *ngFor="let modulo of modulosEmpresa" type="button" class="module-card" (click)="abrirModulo(modulo.ruta)">
        <span class="icono-contenedor"><img [src]="icono(modulo)" class="module-image" [alt]="modulo.titulo"></span>
        <span class="module-content"><strong>{{modulo.titulo}}</strong><small>{{modulo.descripcion}}</small><span class="acceso">Acceder <b>→</b></span></span>
      </button>
    </div>
  </section>
  <section *ngIf="modulosPersonas.length" class="modulos-seccion modulos-personas">
    <div class="seccion-cabecera"><div><h2>Módulos de Personas</h2></div></div>
    <div class="modules-container">
      <button *ngFor="let modulo of modulosPersonas" type="button" class="module-card" (click)="abrirModulo(modulo.ruta)">
        <span class="icono-contenedor"><img [src]="icono(modulo)" class="module-image" [alt]="modulo.titulo"></span>
        <span class="module-content"><strong>{{modulo.titulo}}</strong><small>{{modulo.descripcion}}</small><span class="acceso">Acceder <b>→</b></span></span>
      </button>
    </div>
  </section>
</main>
