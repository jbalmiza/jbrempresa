<supbar></supbar><div class="menu"><sidebar [modulo]="moduloOrigen"></sidebar><main class="pagina catalogo-admin">
  <label class="titulo">GESTIÓN DE CATÁLOGO</label>
  <nav class="toolbar tabs" aria-label="Opciones de Gestión de Catálogo"><button class="boton boton-accion accion-consultar" [class.activa]="vista==='configuracion'" (click)="vista='configuracion'">Configuración</button><button class="boton boton-accion accion-volver" (click)="volver()">Volver</button><button class="boton boton-accion opcion-catalogo" [class.activa]="vista==='qr'" (click)="vista='qr'">Códigos QR</button><button class="boton boton-accion opcion-catalogo" [class.activa]="vista==='preview'" (click)="vista='preview'">Vista previa</button></nav>
  <p *ngIf="mensaje" class="mensaje">{{mensaje}}</p>
  <section *ngIf="vista==='configuracion'" class="panel"><h2>Publicación</h2><label class="interruptor"><input type="checkbox" [(ngModel)]="config.publicado"><span>Catálogo publicado</span></label><label class="interruptor"><input type="checkbox" [(ngModel)]="config.permitirDomicilio"><span>Permitir pedidos a domicilio</span></label><p class="estado-imagen" [class.correcto]="config.empresaConImagen">Imagen de empresa: {{config.empresaConImagen?'configurada':'pendiente'}}</p><button class="boton boton-accion accion-guardar" (click)="guardarConfig()">Guardar configuración</button></section>
  <section *ngIf="vista==='qr'" class="panel"><h2>Posiciones</h2><div class="form-posicion"><label>Ubicación<input maxlength="100" [(ngModel)]="posicion.capUbi" placeholder="Zona principal 12"></label><label>Fila<input type="number" min="1" [(ngModel)]="posicion.capFil"></label><label>Columna<input type="number" min="1" [(ngModel)]="posicion.capCol"></label><button class="primario" (click)="guardarPosicion()">{{posicion.capId?'Actualizar':'Añadir'}}</button></div><div class="lista"><article *ngFor="let p of posiciones"><div><strong>{{p.capUbi}}</strong><span>Fila {{p.capFil}} · Columna {{p.capCol}}</span></div><div class="acciones"><button title="Abrir catálogo" (click)="abrirPosicion(p)">Abrir</button><button title="Descargar QR" (click)="descargar(p)">Descargar QR</button><button title="Editar" (click)="editar(p)">Editar</button><button title="Regenerar código" (click)="regenerar(p)">Regenerar</button></div></article></div></section>
  <section *ngIf="vista==='preview'" class="panel preview"><h2>Catálogo general</h2><p>Este enlace genera pedidos a domicilio cuando esa modalidad está habilitada.</p><code>{{enlaceGeneral}}</code><div class="acciones-preview"><button class="boton boton-accion accion-ver" (click)="abrirGeneral()">Vista normal del catálogo</button><button class="boton" (click)="abrirGeneralMovil()">Vista móvil</button></div></section>
</main></div>
