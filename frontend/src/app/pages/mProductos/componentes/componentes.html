<supbar></supbar><div class="menu"><sidebar modulo="productos"></sidebar><main class="pagina"><label class="titulo">{{modoGestion?'GESTIÓN DE COMPONENTES':'REGISTRO DE COMPONENTES'}}</label>
<div barraAcciones class="toolbar"><button class="boton boton-accion accion-consultar" (click)="consultar()">Consultar</button><button *ngIf="seleccionado" class="boton boton-accion accion-ver" (click)="abrir('ver')">Ver</button><button *ngIf="!modoGestion" class="boton boton-accion accion-insertar" (click)="insertar()">Insertar</button><button *ngIf="!modoGestion&&seleccionado" class="boton boton-accion accion-modificar" (click)="abrir('modificar')">Modificar</button><button *ngIf="!modoGestion&&seleccionado" class="boton boton-accion accion-eliminar" (click)="eliminar()">Eliminar</button><button *ngIf="modoGestion&&seleccionado&&seleccionado.cmpTipMov!=='B'" class="boton boton-accion accion-eliminar" (click)="baja()">Baja</button><button *ngIf="modoGestion&&seleccionado?.cmpTipMov==='B'" class="boton" (click)="reactivar()">Reactivar</button><button *ngIf="modoGestion&&seleccionado" class="boton" (click)="historico()">Histórico</button><button class="boton boton-accion accion-volver" (click)="volver()">Volver</button></div>
<section *ngIf="vista==='registro'" class="form-contenedor" [class.solo-lectura]="modo==='ver'"><datosIdentificacion [campos]="[{etiqueta:'Id Empresa',valor:componente.empId},{etiqueta:'Id Componente',valor:componente.cmpId}]"></datosIdentificacion>
<div class="form-grupo"><label class="titulo">Datos Componente</label><div class="form-fila"><div class="form-campo-200"><label class="label">Tipo componente <span class="obligatorio">*</span></label><select [(ngModel)]="componente.cmpTip" name="cmpTip"><option value="INGREDIENTE">Ingrediente</option><option value="MATERIA_PRIMA">Materia prima</option><option value="PIEZA">Pieza</option><option value="MATERIAL">Material</option><option value="ENVASE">Envase</option><option value="ACCESORIO">Accesorio</option></select></div><div class="form-campo-200"><label class="label">Nombre <span class="obligatorio">*</span></label><input maxlength="80" [(ngModel)]="componente.cmpNom" name="cmpNom"><div class="mensaje-obligatorio" *ngIf="mostrarObligatorios&&!componente.cmpNom.trim()">Valor Obligatorio</div></div><div class="form-campo-500"><label class="label">Descripción</label><input maxlength="200" [(ngModel)]="componente.cmpDes" name="cmpDes"></div></div></div>
<div class="form-grupo"><label class="titulo">Datos Importes</label><div class="form-fila"><div class="form-campo-200"><label class="label">Precio adicional sin IVA</label><input type="number" min="0" step="0.01" [(ngModel)]="componente.cmpPreAdi" name="cmpPreAdi"></div><div class="form-campo-200"><label class="label">IVA (%)</label><input type="number" min="0" max="100" step="0.01" [(ngModel)]="componente.cmpIva" name="cmpIva"></div></div></div>
<div class="form-grupo"><label class="titulo">Datos Alérgenos</label><div class="form-fila"><div class="form-campo" *ngFor="let a of [['cmpGluten','Gluten'],['cmpCrustaceos','Crustáceos'],['cmpHuevos','Huevos'],['cmpPescado','Pescado'],['cmpCacahuetes','Cacahuetes'],['cmpSoja','Soja'],['cmpLeche','Leche'],['cmpFrutosCascara','Frutos de cáscara'],['cmpApio','Apio'],['cmpMostaza','Mostaza'],['cmpSesamo','Sésamo'],['cmpSulfitos','Sulfitos'],['cmpAltramuces','Altramuces'],['cmpMoluscos','Moluscos']]"><label class="label">{{a[1]}}</label><input type="checkbox" [(ngModel)]="$any(componente)[a[0]]" [name]="a[0]"></div></div></div>
<datosMovimiento [mostrarTipo]="modoGestion" [mostrarCausa]="modoGestion" [tipo]="componente.cmpTipMov||''" [causa]="componente.cmpCauMov||''" [usuario]="componente.cmpUsuMov||''" [fecha]="componente.cmpFecMov" [activo]="componente.cmpAct"></datosMovimiento><div barraAcciones class="toolbar"><button *ngIf="modo!=='ver'" class="boton boton-accion accion-guardar" (click)="guardar()">Guardar</button><button class="boton boton-accion accion-cancelar" (click)="consultar()">Cancelar</button></div></section>
<section *ngIf="vista==='tabla'||vista==='historico'" class="tabla-contenedor"><tabla [titulo]="vista==='historico'?'HISTÓRICO DE COMPONENTES':'TABLA DE COMPONENTES'" [columnas]="columnas" [titulosColumnas]="titulos" [datos]="datos" (filtroSolicitado)="consultar()" (filaSeleccionada)="seleccionado=$event"></tabla></section></main></div>
