
<supbar></supbar>

<div class="menu">
  
	<sidebar modulo="productos"></sidebar>

<div class="pagina">

	<label class="titulo"> GESTIÓN DE PRODUCTOS </label>

<!-- MENU DE ACCIONES SOBRE EL REGISTRO  -->
<div barraAcciones *ngIf="vistaActiva !== 'historico'" class="toolbar">

    <button class="boton boton-accion accion-malla" (click)="malla()"> Malla </button>
  
  	<button class="boton boton-accion accion-consultar" (click)="consultar()"> Consultar </button>

    <button *ngIf="productoSeleccionado" class="boton boton-accion accion-ver" (click)="ver()"> Ver </button>

	<button *ngIf="productoSeleccionado && productoSeleccionado.proTipMov !== 'B'" class="boton boton-accion accion-modificar" (click)="modificar()"> Modificar </button>

    <button *ngIf="productoSeleccionado && productoSeleccionado.proTipMov !== 'B'" class="boton boton-accion accion-baja" (click)="baja()"> Baja </button>

	<button *ngIf="productoSeleccionado?.proTipMov === 'B'" class="boton boton-accion accion-reactivar" (click)="reactivar()"> Reactivar </button>

	<button *ngIf="productoSeleccionado" class="boton boton-accion accion-eliminar" (click)="eliminar()"> Eliminar </button>

	<button *ngIf="productoSeleccionado" class="boton boton-accion accion-adjuntos" (click)="adjuntos()"> Adjuntos </button>

	<button *ngIf="productoSeleccionado" class="boton boton-accion accion-historico" (click)="historico()"> Histórico </button>
    
  	<button class="boton boton-accion accion-volver" (click)="volver()"> Volver </button>

</div>

<div *ngIf="vistaActiva === 'adjuntos'" class="form-contenedor">
	<div class="form-grupo">
		<label class="titulo">Documentación Adjunta · {{ productoSeleccionado?.proNom }}</label>
		<documentacionAdjunta [modulo]="'PRODUCTOS'" [tipoRegistro]="'PRODUCTO'"
			[registroId]="productoSeleccionado?.proId || 0" [codigoRuta]="'RUTA_DOCUMENTOS_PRODUCTOS'" [permitirImagenPrincipal]="true">
		</documentacionAdjunta>
	</div>
	<div barraAcciones class="toolbar"><button class="boton boton-accion accion-volver" (click)="volverAConsulta()">Volver a consulta</button></div>
</div>

<div *ngIf="vistaActiva === 'historico'" class="tabla-contenedor">
	<label class="titulo">HISTÓRICO DE PRODUCTO · {{ productoSeleccionado?.proNom }}</label>
	<div barraAcciones class="toolbar">
		<button class="boton boton-accion accion-volver" (click)="volverAConsulta()">Volver</button>
		<button *ngIf="(productoSeleccionado?.proIdHis || 1) > 1" class="boton" (click)="deshacer()">Deshacer</button>
	</div>
	<tabla [columnas]="columnas" [titulosColumnas]="titulosColumnas" [incluirBajas]="true" [datos]="datosHistorico"></tabla>
</div>

<!-- MAPA DE REGISTROS -->
<div *ngIf="vistaActiva === 'malla'" class="form-contenedor">

	<mallaRegistros
	    entidad="PRODUCTOS"
	    [obtenerRegistros]="obtenerMallas"
	    [obtenerDetalles]="obtenerProductos"
	    campoIdDetalle="proId"
	    [formatearDetalle]="formatearProductoMalla"
	    [obtenerImagenDetalle]="obtenerImagenProductoMalla"
	    campoId="malRefId"
	    campoTitulo="malDes"
	    campoFila="malFil"
	    campoColumna="malCol"
	    (registroSeleccionado)="abrirProductoDesdeMalla($event)">
	</mallaRegistros>

</div>

<!-- FORMULARIO DE REGISTRO -->
<div *ngIf="vistaActiva === 'registro'" class="form-contenedor" [class.solo-lectura]="modoFormulario === 'ver'">
	<p *ngIf="modoFormulario === 'ver'" class="modo-ver-aviso">Vista de consulta. Los campos no se pueden modificar.</p>

  	<datosIdentificacion [campos]="[{etiqueta:'Id Empresa',valor:producto.empId},{etiqueta:'Id Producto',valor:producto.proId},{etiqueta:'Id Histórico',valor:producto.proIdHis}]"></datosIdentificacion>

  	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Producto </label>

		<div class="form-fila">
		
  			<div class="form-campo-200"> 
  				<label class="label"> Tipo Producto <span class="obligatorio">*</span> </label> 
				<select [(ngModel)]="producto.proTipPro" name="proTipPro"><option value="">Seleccione</option><option *ngFor="let tipo of tiposProducto" [value]="tipo.nombre">{{tipo.nombre}}</option></select>
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !producto.proTipPro"> Valor Obligatorio </div>
  			</div>

  			<div class="form-campo-200"> 
  				<label class="label"> Nombre <span class="obligatorio">*</span> </label> 
  				<input type="text" maxlength="50" [(ngModel)]="producto.proNom" name="proNom">
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !producto.proNom"> Valor Obligatorio </div>
  			</div>
  			
  			<div class="form-campo-500"> 
  				<label class="label"> Descripción </label> 
  				<input type="text" maxlength="200" [(ngModel)]="producto.proDes" name="proDes">
  			</div>
  			
  		</div>

	</div>
	
	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Clasificación </label>

		<div class="form-fila">
		
  			<div class="form-campo-200"> 
  				<label class="label"> Categoría <span class="obligatorio">*</span> </label> 
  				<input type="text" maxlength="50" [(ngModel)]="producto.proCat" name="proCat">
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !producto.proCat"> Valor Obligatorio </div>
  			</div>

  			<div class="form-campo-200"> 
  				<label class="label"> Subcategoría </label> 
  				<input type="text" maxlength="50" [(ngModel)]="producto.proSubCat" name="proSubCat">
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Marca <span class="obligatorio">*</span> </label> 
  				<input type="text" maxlength="50" [(ngModel)]="producto.proMar" name="proMar">
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !producto.proMar"> Valor Obligatorio </div>
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Modelo </label> 
  				<input type="text" maxlength="50" [(ngModel)]="producto.proMod" name="proMod">
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Proveedor <span class="obligatorio">*</span> </label> 
  				<input type="text" maxlength="200" [(ngModel)]="producto.proPro" name="proPro">
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !producto.proPro"> Valor Obligatorio </div>
  			</div>
  			
  		</div>

	</div>
	
	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Económicos </label>

		<div class="form-fila">
		
  			<div class="form-campo-200"> 
  				<label class="label"> Precio Compra <span class="obligatorio">*</span> </label> 
  				<input type="number" maxlength="30" [(ngModel)]="producto.proPreCom" name="proPreCom">
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !producto.proPreCom"> Valor Obligatorio </div>
  			</div>

  			<div class="form-campo-200"> 
  				<label class="label"> Precio Venta <span class="obligatorio">*</span> </label> 
  				<input type="number" maxlength="50" [(ngModel)]="producto.proPreVen" name="proPreVen" 
  				(input)="actualizarPrecioFinal()">
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !producto.proPreVen"> Valor Obligatorio </div>
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Descuento </label> 
  				<input type="number" maxlength="200" [(ngModel)]="producto.proPreDes" name="proPreDes" 
  				(input)="actualizarPrecioFinal()">
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> I.V.A. <span class="obligatorio">*</span> </label> 
  				<input type="number" maxlength="200" [(ngModel)]="producto.proPreIva" name="proPreIva" 
  				(input)="actualizarPrecioFinal()">
  				<div class="mensaje-obligatorio" *ngIf="mostrarObligatorios && !producto.proPreIva"> Valor Obligatorio </div>
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Precio Final </label> 
  				<input type="number" maxlength="200" [(ngModel)]="producto.proPreFin" name="proPreFin" disabled>
  			</div>
  			
  		</div>

	</div>

	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Inventario </label>

		<div class="form-fila">
		
  			<div class="form-campo-200"> 
  				<label class="label"> Stock Actual </label> 
  				<input type="number" maxlength="10" [(ngModel)]="producto.proStoAct" name="proStoAct">
  			</div>

  			<div class="form-campo-200"> 
  				<label class="label"> Stock Mínimo </label> 
  				<input type="number" maxlength="10" [(ngModel)]="producto.proStoMin" name="proStoMin">
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label"> Unidad Medida </label> 
  				<input type="text" maxlength="30" [(ngModel)]="producto.proUniMed" name="proUniMed">
  			</div>
  			
  			<div class="form-campo-200"> 
  				<label class="label">Control Stock</label> 
  				<input type="checkbox" maxlength="10" [(ngModel)]="producto.proConSto" name="proConSto"> 
  			</div>
  			
  		</div>

	</div>
	
	<div class="form-grupo"> 
  	
  	<label class="titulo"> Datos Adicionales </label>

		<div class="form-fila">
		
			<div class="form-campo-500"> 
				<label class="label"> Observaciones </label> 
				<input type="text" maxlength="200" [(ngModel)]="producto.proObs" name="proObs">
			</div>
			<div class="form-campo-200"><label class="label">Duración (minutos)</label><input type="number" min="0" step="5" [(ngModel)]="producto.proDurMin" name="proDurMin"></div>
			<div class="form-campo-200"><label class="label">Visible en catálogo</label><input type="checkbox" [(ngModel)]="producto.proVisCat" name="proVisCat"></div>
  			
  		</div>

	</div>
	
	<div class="form-grupo"> 
	
	<label class="titulo"> Datos Ubicación </label>

		<div class="form-fila">

  			<div class="form-campo-200"> 
  				<label class="label"> Ubicación </label> 
  				<input type="text" maxlength="100" [(ngModel)]="producto.proUbi" name="domUbi"> 
  			</div>
  			  
  			<div class="form-campo"> 
  				<label class="label"> Fila Malla </label> 
  				<input type="number" maxlength="100" [(ngModel)]="producto.proFilMal" name="domFilMal" disabled> 
  			</div>
  			
  			<div class="form-campo"> 
  				<label class="label"> Columna Malla </label> 
  				<input type="number" maxlength="100" [(ngModel)]="producto.proColMal" name="domColMal" disabled> 
  			</div>
  			  
			<div class="form-campo-200">
			    <label class="label"> Malla </label>
				<selectorMalla
					entidad="PRODUCTOS"
				    [(fila)]="producto.proFilMal"
				    [(columna)]="producto.proColMal">
				</selectorMalla>
			</div>
 	
 		</div>
 	
 	</div>

	<datosMovimiento [tipo]="producto.proTipMov||''" [causa]="producto.proCauMov||''" [usuario]="producto.proUsuMov||''" [fecha]="producto.proFecMov" [activo]="producto.proAct"></datosMovimiento>
 
	<div barraAcciones class="toolbar"> 
	
		<button *ngIf="modoFormulario === 'insertar'" class="boton boton-accion accion-guardar" (click)="guardar()"> Guardar </button>
		
		<button *ngIf="modoFormulario === 'modificar'" class="boton boton-accion accion-actualizar" (click)="actualizar()"> Actualizar </button>
		
		<!-- Botón Cancelar tiene misma lógica que consultar -->
		<button class="boton boton-accion accion-cancelar" (click)="consultar()"> Cancelar </button>
		
	</div>

</div>

<!-- TABLA DE RESULTADOS-->
<div *ngIf="vistaActiva === 'tabla'" class="tabla-contenedor">

  	<tabla 
  	
		titulo="TABLA DE PRODUCTOS"
		[permitirImportar]="true"
		[permitirExportar]="true"
		(exportarSolicitado)="exportar()"
  		[columnas]="columnas" 
  		[titulosColumnas]="titulosColumnas"
  		[datos]="datos" 
		(filaSeleccionada)="productoSeleccionado = $event"> 
  		
  	</tabla>

</div>

<!-- Cierres de div class menu y pagina -->
</div> </div>
