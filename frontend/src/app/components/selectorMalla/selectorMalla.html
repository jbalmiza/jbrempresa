<button type="button" class="boton" (click)="abrirMalla()">
    ▦ Seleccionar en Malla
</button>

<div class="fondo" *ngIf="mostrarMalla">

    <div class="ventana">

        <div class="cabecera">

            <span>Seleccionar Malla</span>

            <button
                type="button"
                class="boton cerrar"
                aria-label="Cerrar selector de malla"
                (click)="cerrarMalla()">
                ✖
            </button>

        </div>

        <div #contenedor class="malla"></div>

        <div class="pie">

            <span class="posicion">Fila {{ filaSeleccionada }} · Columna {{ columnaSeleccionada }}</span>

            <button
                type="button"
                class="boton"
                (click)="aceptarMalla()">
                Aceptar
            </button>

            <button
                type="button"
                class="boton"
                (click)="cerrarMalla()">
                Cancelar
            </button>

        </div>

    </div>

</div>
