<main class="pantalla"><header><div class="barra-superior"><div class="marca"><img *ngIf="logo" [src]="logo" [alt]="'Logo de '+nombre"><span *ngIf="!logo">{{nombre}}</span></div><div class="buscador"><input [ngModel]="busqueda" (ngModelChange)="busquedaChange.emit($event)" (focus)="focoBusqueda.emit($event)" [placeholder]="placeholderBusqueda" [attr.aria-label]="placeholderBusqueda"></div><button class="cerrar" (click)="cerrar.emit()" aria-label="Cerrar pantalla táctil">✕ Cerrar</button></div><ng-content select="[navegacionTactil]"></ng-content></header><div class="cuerpo"><section class="principal"><ng-content select="[contenidoTactil]"></ng-content></section><aside class="lateral"><ng-content select="[panelTactil]"></ng-content></aside></div></main><ng-content select="[accesorioTactil]"></ng-content>
