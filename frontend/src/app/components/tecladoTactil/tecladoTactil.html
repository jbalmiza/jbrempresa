<section *ngIf="campo" class="teclado" (pointerdown)="$event.preventDefault()" aria-label="Teclado táctil"><div class="fila" *ngFor="let fila of filas"><button *ngFor="let tecla of fila" type="button" (click)="escribir(tecla)">{{mayus?tecla:tecla.toLocaleLowerCase('es-ES')}}</button></div><div class="fila acciones"><button type="button" [class.activo]="mayus" (click)="mayus=!mayus">⇧ Mayús</button><button type="button" class="espacio" (click)="espacio()">Espacio</button><button type="button" (click)="borrar()">⌫ Borrar</button><button type="button" (click)="enter()">↵ Intro</button><button type="button" class="cerrar" (click)="cerrar.emit()">✕ Teclado</button></div></section>
