<article class="concepto"><button class="principal" [style.background-image]="fondo" (click)="agregar.emit()"><span class="nombre">{{concepto.nombre}}</span><span class="descripcion">{{concepto.descripcion}}</span><strong>{{precio|currency:'EUR':'symbol':'1.2-2'}}</strong></button><div class="contador"><button (click)="quitar.emit()" [disabled]="!cantidad" [attr.aria-label]="'Quitar '+concepto.nombre">−</button><span>{{cantidad}}</span><button (click)="agregar.emit()" [attr.aria-label]="'Añadir '+concepto.nombre">+</button></div></article>
