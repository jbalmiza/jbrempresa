<header class="barra-superior">
  <img *ngIf="imagenEmpresaUrl" class="imagen-empresa" [src]="imagenEmpresaUrl" alt="Imagen de la empresa">
  <div class="contexto-sesion" aria-label="Contexto de la sesión">
    <span><small>Empresa</small><strong>{{ usuarioEmpresa }}</strong></span>
    <i aria-hidden="true"></i>
    <span><small>Usuario</small><strong>{{ usuarioUsuario }}</strong></span>
    <i aria-hidden="true"></i>
    <span><small>Perfil</small><strong>{{ usuarioPerfil }}</strong></span>
  </div>

  <div class="fecha-actual"><span>Hoy: <strong>{{diaSemana}}</strong></span><small>{{fechaActual}}</small></div>

  <div class="barra-acciones">
    <button *ngIf="mostrarBotonModulos" type="button" class="boton-modulos" (click)="modulos()">Módulos</button>
    <button type="button" class="boton-salir" (click)="salir()">Salir</button>
  </div>
</header>
