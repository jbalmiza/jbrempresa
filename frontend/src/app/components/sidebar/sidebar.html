<button type="button" class="hamburguesa" [attr.aria-expanded]="menuMovilAbierto" aria-label="Abrir o cerrar menú" (click)="toggleSidebar()">☰</button>
<nav class="sidebar" [class.sidebar-abierto]="menuMovilAbierto" aria-label="Menú del módulo">
  <ng-container *ngIf="menuActual as menu">
    <h2>{{menu.titulo}}</h2>
    <ul>
      <ng-container *ngFor="let grupo of menu.grupos">
        <li class="menu-title" [class.abierto]="menuAbierto===grupo.id" (click)="toggleMenu(grupo.id)">{{grupo.texto}}</li>
        <ul *ngIf="menuAbierto===grupo.id" class="submenu">
          <li *ngFor="let opcion of grupo.opciones" [class.inactivo]="!opcion.ruta" [class.activo]="esActiva(opcion.ruta)" (click)="opcion.ruta&&abrirPagina(opcion.ruta)">{{opcion.texto}}</li>
        </ul>
      </ng-container>
    </ul>
  </ng-container>
</nav>
