<div class="avisos" aria-live="polite"><div *ngFor="let a of dialogos.avisos()" [class]="'aviso '+a.tipo"><span>{{a.mensaje}}</span><button type="button" aria-label="Cerrar" (click)="dialogos.cerrarAviso(a.id)">×</button></div></div>
<div *ngIf="dialogos.confirmacion() as c" class="fondo-modal" (click)="dialogos.responder(false)"><section class="modal" role="alertdialog" aria-modal="true" (click)="$event.stopPropagation()"><h2>Confirmación</h2><p>{{c.mensaje}}</p><div class="acciones"><button class="cancelar" (click)="dialogos.responder(false)">Cancelar</button><button [class.destructiva]="c.destructiva" (click)="dialogos.responder(true)">Confirmar</button></div></section></div>
